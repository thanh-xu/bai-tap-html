<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh nhỏ</title>
</head>
<body>

    <p><img src="Cool.jpeg" width="150" alt="Ảnh chó 1"></p>
    <p><img src="Chó Funny.jpg" width="150" alt="Ảnh chó 2"></p>
    <p><img src="xmas.jpg" width="150" alt="Ảnh chó 3"></p>
    <p><img src="Summer.jpeg" width="150" alt="Ảnh chó 4"></p>
    
    <p>
        <a href="https://www.google.com" target="_blank">
        <div><img src="Anh5.webp" width="150" alt="Ảnh chó 5"></div></a>
        <div><img src="Anh6.jpg" width="150" alt="Ảnh chó 6"></div>
        <div><img src="Anh7.jpg" width="150" alt="Ảnh chó 7"></div>
        <div><img src="Anh8.jpg" width="150" alt="Ảnh chó 8"></div>
    </p>

</body>
</html>

Trả lời câu hỏi:
<p>
    1. Phần 1: các ảnh nằm cùng một hàng, vì &lt;img&gt;
    là thẻ inline nên nối đuôi nhau như chữ.
</p>
<p>
    2. Phần 2: mỗi ảnh một hàng, vì &lt;div&gt; là thẻ
    block, luôn xuống dòng mới và chiếm hết chiều ngang.
</p>
<p>
    3. &lt;img&gt; là thẻ inline, &lt;div&gt; là thẻ block.
</p>
